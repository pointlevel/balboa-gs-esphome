# Balboa GS510DZ + panel VL801D -> Home Assistant via ESPHome
# Hårdvara: Wemos D1 mini (ESP8266) på MagnusPers kretskort
#   D1 (GPIO5)  = klocka      (RJ45 stift 6)
#   D2 (GPIO4)  = displaydata (RJ45 stift 5)
#   D8 (GPIO15) = knappdata   (via optokopplare till RJ45 stift 3)

substitutions:
  name: spabad
  friendly_name: Spabad
  # Uppskattade effekter i watt, justera mot märkskyltarna
  heater_w: "2750"   # 3,0 kW vid 240 V blir ca 2,75 kW vid 230 V
  circ_w: "100"      # cirkulationspump, antas gå hela tiden
  pump1_w: "1500"
  pump2_w: "1500"
  blower_w: "700"
  base_w: "10"       # elektronik, ozonator, belysning

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp8266:
  board: d1_mini            # byt till d1_mini_pro om du använder Pro-varianten

external_components:
  - source: github://pointlevel/balboa-gs-esphome@main
    components: [balboa_gs]
    refresh: 1h

logger:
  level: INFO               # sätt DEBUG för att se varje knapptryck

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none     # jämnare avbrottshantering och stabilare WiFi
  ap:
    ssid: "Spabad Fallback"
    password: !secret fallback_password

captive_portal:

web_server:
  port: 80

balboa_gs:
  id: spa
  clock_pin: D1
  data_pin: D2
  button_pin: D8
  button_repeat: 1          # öka till 2-3 om knapptryck ibland missas
  probe_setpoint: true      # tryck Temp upp en gång efter start för att läsa måltemperaturen
  setpoint_flag_bit: 40     # "TempMenu": displayen visar inställd temperatur

  water_temperature:
    name: "Vattentemperatur"
    filters:
      - delta: 0.1
  target_temperature:
    name: "Inställd temperatur"
  display:
    name: "Display"
  connected:
    name: "Panelkontakt"
    id: spa_connected
  raw_bits:
    name: "Råbitar 29-71"   # för att kartlägga t.ex. värmen; kan tas bort sen

  heater:
    name: "Värme"
    id: spa_heater
  pump1:
    name: "Pump 1"
    id: spa_pump1
  pump2:
    name: "Pump 2"
    id: spa_pump2
  blower:
    name: "Blåsmaskin"
    id: spa_blower
  light:
    name: "Belysning"
  filtration:
    name: "Filtrering"
  filter1:
    name: "Filtercykel 1"
  filter2:
    name: "Filtercykel 2"
  standard_mode:
    name: "Standardläge"
  eco_mode:
    name: "Ekoläge"

number:
  - platform: template
    name: "Måltemperatur"
    icon: mdi:thermometer-water
    unit_of_measurement: "°C"
    device_class: temperature
    min_value: 26
    max_value: 40
    step: 0.5
    mode: box
    update_interval: 5s
    lambda: |-
      float t = id(spa).get_target_temperature();
      if (std::isnan(t)) return {};
      return t;
    set_action:
      - lambda: 'id(spa).set_target_temperature(x);'

select:
  - platform: template
    name: "Värmeläge"
    icon: mdi:thermostat
    options: ["Standard", "Economy", "Sleep"]
    update_interval: 2s
    lambda: |-
      std::string m = id(spa).get_heat_mode();
      if (m.empty()) return {};
      return m;
    set_action:
      - lambda: 'id(spa).set_heat_mode(x);'

button:
  - platform: template
    name: "Belysning (tryck)"
    icon: mdi:lightbulb
    on_press:
      - lambda: 'id(spa).press_button(esphome::balboa_gs::BTN_LIGHT);'
  - platform: template
    name: "Pump 1 (tryck)"
    icon: mdi:pump
    on_press:
      - lambda: 'id(spa).press_button(esphome::balboa_gs::BTN_PUMP1);'
  - platform: template
    name: "Pump 2 (tryck)"
    icon: mdi:pump
    on_press:
      - lambda: 'id(spa).press_button(esphome::balboa_gs::BTN_PUMP2);'
  - platform: template
    name: "Blåsmaskin (tryck)"
    icon: mdi:weather-windy
    on_press:
      - lambda: 'id(spa).press_button(esphome::balboa_gs::BTN_BLOWER);'
  - platform: template
    name: "Mode (tryck)"
    icon: mdi:swap-horizontal
    entity_category: config
    on_press:
      - lambda: 'id(spa).press_button(esphome::balboa_gs::BTN_MODE);'
  - platform: template
    name: "Temp upp"
    icon: mdi:thermometer-plus
    on_press:
      - lambda: 'id(spa).step_temperature(1);'
  - platform: template
    name: "Time (tryck)"
    entity_category: config
    on_press:
      - lambda: 'id(spa).press_button(esphome::balboa_gs::BTN_TIME);'
  - platform: template
    name: "Temp ner"
    icon: mdi:thermometer-minus
    on_press:
      - lambda: 'id(spa).step_temperature(-1);'
  - platform: restart
    name: "Starta om"
    entity_category: config

sensor:
  - platform: template
    name: "Effekt (uppskattad)"
    id: spa_power
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      if (!id(spa_connected).state) return {};
      float w = ${circ_w} + ${base_w};
      if (id(spa_heater).state) w += ${heater_w};
      if (id(spa_pump1).state) w += ${pump1_w};
      if (id(spa_pump2).state) w += ${pump2_w};
      if (id(spa_blower).state) w += ${blower_w};
      return w;
  - platform: integration
    name: "Energi (uppskattad)"
    sensor: spa_power
    time_unit: h
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 2
    filters:
      - multiply: 0.001
  - platform: wifi_signal
    name: "WiFi-signal"
    update_interval: 60s
  - platform: uptime
    name: "Drifttid"
